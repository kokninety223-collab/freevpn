workflows:
  android-vpn-build:
    name: Build Android VPN App
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        PACKAGE_NAME: "com.aistudio.pacificvpn.xkyzrt"

    triggering:
      events:
        - push
        - tag
        - pull_request
      branch_patterns:
        - pattern: '*'
          include: true

    scripts:
      - name: Set up Environment & Permissions
        script: |
          echo "=== Setting up environment ==="
          # Ensure gradlew has executable permissions
          chmod +x gradlew

          # Safe handling for .env configuration
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          else
            touch .env
          fi

          # Safe fallback for debug.keystore if base64 file exists
          if [ ! -f "debug.keystore" ] && [ -f "debug.keystore.base64" ]; then
            base64 --decode debug.keystore.base64 > debug.keystore || true
          fi

      - name: Build Android APK
        script: |
          echo "=== Building Android APK ==="
          # First attempt release build, fallback smoothly to debug build if signing credentials are not present
          if ./gradlew assembleRelease --stacktrace; then
            echo "Release build succeeded!"
          else
            echo "Release build not signed or failed. Falling back to debug build..."
            ./gradlew assembleDebug --stacktrace
          fi

    artifacts:
      - app/build/outputs/apk/**/*.apk

    publishing:
      email:
        recipients:
          - kokninety223@gmail.com
        notify:
          success: true
          failure: true
